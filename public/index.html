<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Telecom OS | CASE 15</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-symbol">◈</div>

            telecom<span>OS</span><small>CASE 15 / DATABASE SYSTEM</small>
          </div>
        </div>
        <div class="nav-label">БАСҚАРУ</div>
        <nav id="nav">
          <button class="active" data-page="dashboard">

        <div id="content" class="content"></div>

    <div class="toast" id="toast" role="status"></div>
